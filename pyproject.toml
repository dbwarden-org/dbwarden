[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbwarden"
version = "0.17.0"
description = "The SQL-first database toolkit for SQLAlchemy." 
readme = "README.md"
license = "MIT"
requires-python = ">=3.12.7"
authors = [
    { name = "Emiliano Gandini Outeda", email = "emiliano.gandini@protonmail.com" }
]
keywords = [
    "database",
    "migrations",
    "sqlalchemy",
    "postgres",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "attrs>=24.2.0",
    "cattrs>=24.1.0",
    "packaging>=24.0",
    "pyyaml>=6.0.3",
    "rich>=12.2.0",
    "sqlalchemy>=2.0.10,<2.1",
    "typer>=0.12.3",
]

[project.urls]
Homepage = "https://dbwarden.org/"
Repository = "https://github.com/dbwarden-org/dbwarden"
Documentation = "https://dbwarden.org/"
"Bug Tracker" = "https://github.com/dbwarden-org/dbwarden/issues"

[project.scripts]
dbwarden = "dbwarden.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "prometheus-client>=0.21.0",
    # Docs-site tooling only; not imported by the dbwarden package itself.
    # seoslug 2.1.0 is the floor: zensical.toml loads seoslug.contrib.zensical,
    # which was added in that release.
    "zensical>=0.0.44",
    "seoslug>=2.1.0",
    "httpx2>=2.4.0",
]

postgres = [
    "psycopg2-binary>=2.9.11",
]
sqlite = [
]
clickhouse = [
    "clickhouse-connect>=0.7.15",
    "aiohttp>=3.14.1",
]
mysql = [
    "pymysql>=1.1.0",
]
[tool.hatch.build.targets.wheel]
packages = ["dbwarden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "p0: Two-cycle convergence gate that must never regress",
    "integration: Tests requiring a live ClickHouse container (--ch-integration)",
    "sql: Pure SQL generation and operation contract tests",
    "sqlite: SQLite-backed migration lifecycle tests",
]

[tool.coverage.run]
source = ["dbwarden"]

[tool.coverage.report]
omit = ["tests/*"]

[tool.uv]
environments = ["sys_platform == 'linux'"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "typer",
]
mysql = [
    "pymysql>=1.1.0",
]
